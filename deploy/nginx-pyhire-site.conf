# PyHire marketing website — pyhire.veriright.com
#
# Install on devserver as:
#   sudo cp deploy/nginx-pyhire-site.conf /etc/nginx/sites-available/pyhire-site
#   sudo ln -s /etc/nginx/sites-available/pyhire-site /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS was issued on 2026-08-26 with:
#   sudo certbot --nginx -d pyhire.veriright.com --redirect
# The `# managed by Certbot` lines below are certbot's own edits, reproduced here
# so this file matches what is live on the server. Renewal is automatic via the
# certbot.timer systemd unit; the cert is at
# /etc/letsencrypt/live/pyhire.veriright.com/.
#
# If you ever reinstall this file over the live one, re-run the certbot command
# above afterwards — or the site drops back to plain HTTP.
#
# This is a SEPARATE site from `pyhire-uat`, which serves the TruHire product
# frontend at uat.pyhire.veriright.com out of /home/veriright/pyhire-frontend/dist.
# Nothing here touches that site.

server {
    server_name pyhire.veriright.com;

    root /home/veriright/pyhire-site/dist;
    index index.html;

    # Enquiries are small; no need to accept large bodies.
    client_max_body_size 256k;

    # ---------------------------------------------------------------------
    # Contact form API — pyhire-site-api under pm2, bound to localhost only.
    # ---------------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8060;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ---------------------------------------------------------------------
    # Pre-redesign URLs (before the Oct 2026 content document) → new pages.
    # Permanent redirects so search engines move the old pages' ranking
    # across. Mirrors `legacyRedirects` in src/data/navigation.ts, which
    # handles the same paths client-side.
    # ---------------------------------------------------------------------
    location = /job-management           { return 301 /product/jobs-and-candidates; }
    location = /candidate-management     { return 301 /product/jobs-and-candidates; }
    location = /ai-candidate-matching    { return 301 /product/ai; }
    location = /interview-management     { return 301 /product/interviews-and-offers; }
    location = /unified-communication    { return 301 /product/communication; }
    location = /client-vendor-management { return 301 /product/clients-and-vendors; }
    location = /analytics-dashboards     { return 301 /product/analytics; }
    location = /compliance-security      { return 301 /; }
    location = /about-us                 { return 301 /about; }
    location = /contact-us               { return 301 /contact; }

    # ---------------------------------------------------------------------
    # THE CRITICAL RULE.
    #
    # This site is PRERENDERED: `npm run build` writes a real index.html for
    # every route, e.g. /product/jobs-and-candidates/index.html and
    # /case-studies/case-study-01-agency-multi-client/index.html.
    #
    # `$uri/` MUST come before the /index.html fallback. If the SPA fallback
    # runs first it shadows every prerendered page, and crawlers that do not
    # execute JavaScript — GPTBot, ClaudeBot, PerplexityBot, most social
    # scrapers — receive the empty shell for the entire site. Humans would see
    # no difference, which is exactly what makes the mistake so easy to ship.
    #
    # Verify after deploying:
    #   curl -s https://pyhire.veriright.com/product/ai | grep -o "<h2" | wc -l
    #   -> non-zero means prerendered; 0 means this rule is wrong.
    # ---------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached: it names hashed chunk files that change
    # on every deploy, and a stale copy asks for chunks that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        expires 0;
    }

    # Same reasoning for every prerendered route's index.html.
    location ~ ^/.*/index\.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        expires 0;
    }

    # Hashed assets are immutable — the filename changes when the content does.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Media and images keep their names across deploys, so cache them for a
    # week rather than a year — long enough to matter, short enough to correct.
    location ~* \.(mp4|webp|png|jpe?g|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Crawlers ask for these constantly; keep them fresh.
    location = /sitemap.xml { expires 1h; }
    location = /robots.txt  { expires 1h; }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1024;

    access_log /var/log/nginx/pyhire-site.access.log;
    error_log  /var/log/nginx/pyhire-site.error.log;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/pyhire.veriright.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/pyhire.veriright.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}


# Plain HTTP exists only to bounce visitors and crawlers to HTTPS.
server {
    if ($host = pyhire.veriright.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name pyhire.veriright.com;
    return 404; # managed by Certbot
}
